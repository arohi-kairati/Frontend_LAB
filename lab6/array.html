<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr = [1, 2, 3, 4, 0, 0, -1, -22, 6];
        let sumPos = 0;
        let sumNeg = 0;
        let zeroes = 0;
        for(let i = 0; i < arr.length; i++){
            if(arr[i] > 0){
                sumPos += arr[i];
            } else if(arr[i] < 0){
                sumNeg += arr[i];
            } else {
                zeroes++;
            }
        }

        console.log(sumPos);
        console.log(sumNeg);
        console.log(zeroes);
    </script>
</body>
</html>
