<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i = 2; i <= 97; i++){
            let c = 0;
            for(let j = 2; j <= Math.sqrt(i); j++){
                if(i % j == 0){
                    c++;
                }
            }
            if(c == 0){
                console.log(i);
            }
        }
    </script>
</body>
</html>
