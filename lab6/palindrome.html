<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = 12321;
        let n = num;
        let revNum = 0;
        while(n > 0){
            let rem = n % 10;
            revNum = revNum*10 + rem;
            n = Math.floor(n/10);
        }
        if(revNum == num){
            console.log(true);
        } else {
            console.log(false);
        }
    </script>
</body>
</html>
