<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr = [5, 8, 3, 7, 4, 6, 2];
        let sumEven = 0;
        let sumOdd = 0;
        let i = 0;
        while(i < arr.length){
            if(arr[i] % 2 == 0){
                sumEven += arr[i];
            } else {
                sumOdd += arr[i];
            }
            i++;
        }
        console.log(sumEven);
        console.log(sumOdd);
    </script>
</body>
</html>
