<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i = 100; i <= 999; i++){
            let sum = 0;
            let num = i;
            while(num > 0){
                let rem = num%10;
                sum += Math.pow(rem, 3);
                num = Math.floor(num/10);
            }
            if(sum == i){
                console.log(i);
            }
        }
    </script>
</body>
</html>
